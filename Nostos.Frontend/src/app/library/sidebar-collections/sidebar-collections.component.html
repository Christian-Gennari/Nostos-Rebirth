<button class="floating-toggle" (click)="toggle()" [class.hidden]="expanded()">
  <lucide-icon [img]="MenuIcon" [size]="24"></lucide-icon>
</button>

<nav class="sidebar" [class.collapsed]="!expanded()" [class.collapsing]="collapseSidebarProgress()">
  <div class="sidebar-header">
    @if (expanded()) {
      <img class="brand-icon" src="logo-idea-gradient_2_no-bg.png" alt="logo" />
      <div class="brand" animate.enter="fade-in">Collections</div>
    } @else {
      <img class="brand-icon" src="logo-idea-gradient_2_no-bg.png" alt="logo" />
    }
  </div>

  <div class="nav-scroll-area">
    <div class="nav-group">
      <button
        class="nav-item"
        routerLink="/library"
        [queryParams]="{ filter: null, collection: null }"
        [queryParamsHandling]="'merge'"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        title="All Books"
        (click)="onStatusNavClick()"
      >
        <lucide-icon [img]="LibraryIcon" [size]="18" strokeWidth="1"></lucide-icon>
        @if (expanded()) {
          <span class="label">All Books</span>
          <span class="count-badge">{{ statusCounts()?.all }}</span>
        }
      </button>

      <button
        class="nav-item"
        routerLink="/library"
        [queryParams]="{ filter: 'notstarted' }"
        [queryParamsHandling]="'merge'"
        routerLinkActive="active"
        title="Not Started"
        (click)="onStatusNavClick()"
      >
        <lucide-icon [img]="CircleDashedIcon" [size]="18" strokeWidth="1"></lucide-icon>
        @if (expanded()) {
          <span class="label">Not Started</span>
          <span class="count-badge">{{ statusCounts()?.notStarted }}</span>
        }
      </button>

      <button
        class="nav-item"
        routerLink="/library"
        [queryParams]="{ filter: 'reading' }"
        [queryParamsHandling]="'merge'"
        routerLinkActive="active"
        title="In Progress"
        (click)="onStatusNavClick()"
      >
        <lucide-icon [img]="BookOpenIcon" [size]="18" strokeWidth="1"></lucide-icon>
        @if (expanded()) {
          <span class="label">In Progress</span>
          <span class="count-badge">{{ statusCounts()?.reading }}</span>
        }
      </button>

      <button
        class="nav-item"
        routerLink="/library"
        [queryParams]="{ filter: 'favorites' }"
        [queryParamsHandling]="'merge'"
        routerLinkActive="active"
        title="Favorites"
        (click)="onStatusNavClick()"
      >
        <lucide-icon [img]="HeartIcon" [size]="18" strokeWidth="1"></lucide-icon>
        @if (expanded()) {
          <span class="label">Favorites</span>
          <span class="count-badge">{{ statusCounts()?.favorites }}</span>
        }
      </button>

      <button
        class="nav-item"
        routerLink="/library"
        [queryParams]="{ filter: 'finished' }"
        [queryParamsHandling]="'merge'"
        routerLinkActive="active"
        title="Finished"
        (click)="onStatusNavClick()"
      >
        <lucide-icon [img]="CheckCircleIcon" [size]="18" strokeWidth="1"></lucide-icon>
        @if (expanded()) {
          <span class="label">Finished</span>
          <span class="count-badge">{{ statusCounts()?.finished }}</span>
        }
      </button>

      <button
        class="nav-item"
        routerLink="/library"
        [queryParams]="{ filter: 'unsorted' }"
        [queryParamsHandling]="'merge'"
        routerLinkActive="active"
        title="Unsorted"
        (click)="onStatusNavClick()"
      >
        <lucide-icon [img]="InboxIcon" [size]="18" strokeWidth="1"></lucide-icon>
        @if (expanded()) {
          <span class="label">Unsorted</span>
          <span class="count-badge">{{ statusCounts()?.unsorted }}</span>
        }
      </button>
    </div>

    <div class="nav-group">
      @if (expanded()) {
        <div class="section-label" animate.enter="fade-in" style="margin-top: 1rem">
          Collections
        </div>

        <div class="root-drop-list" [style.min-height]="'50px'">
          <app-flat-tree
            [items]="treeItems()"
            [activeId]="activeId()"
            [editingId]="editingId()"
            [treatAllAsFolders]="true"
            (nodeSelected)="select($event.id)"
            (nodeMoved)="onItemMoved($event)"
            (nodeRenamed)="startRename($event)"
            (nodeDeleted)="deleteCollection($event)"
            (nodeRenameSaved)="saveRename($event.id, $event.newName)"
            (nodeRenameCancelled)="cancelRename()"
          ></app-flat-tree>
        </div>
      }
    </div>

    <div class="nav-group mt-auto">
      @if (adding()) {
        <div class="nav-item input-mode">
          <lucide-icon [img]="PlusIcon" [size]="18" strokeWidth="1"></lucide-icon>
          @if (expanded()) {
            <input
              type="text"
              class="sidebar-input"
              [(ngModel)]="newName"
              (keydown.enter)="create()"
              (keydown.escape)="resetInput()"
              placeholder="Name..."
              autoFocus
            />
          }
        </div>
      } @else {
        <button class="nav-item action-add" (click)="startAdd()" title="Create Collection">
          <lucide-icon [img]="PlusIcon" [size]="18" strokeWidth="1"></lucide-icon>
          @if (expanded()) {
            <span class="label">New Collection</span>
          }
        </button>
      }
    </div>
  </div>

  <div class="sidebar-footer">
    @if (!expanded() && activeId()) {
      <span
        class="collapsed-collection-indicator"
        role="status"
        [attr.title]="'Viewing ' + (getNameForId(activeId()!) || 'collection')"
        aria-label="A collection is selected"
      >
        <lucide-icon [img]="FolderIcon" [size]="14" strokeWidth="1.5"></lucide-icon>
      </span>
    }
    <button class="toggle-btn" (click)="toggle()">
      @if (expanded()) {
        <lucide-icon [img]="PanelLeftCloseIcon" [size]="18" strokeWidth="1"></lucide-icon>
      } @else {
        <lucide-icon [img]="PanelLeftOpenIcon" [size]="18" strokeWidth="1"></lucide-icon>
      }
    </button>
  </div>
</nav>
