<button class="floating-toggle" (click)="toggle()" [class.hidden]="expanded()">
  <lucide-icon [img]="MenuIcon" [size]="20"></lucide-icon>
</button>

<nav class="sidebar" [class.collapsed]="!expanded()">
  <div class="sidebar-header">
    <!-- Brand mark, token-driven. The symbol is two flat fills, so driving them
         from the palette re-inks it for the dark theme without shipping a
         second asset that could drift. Light is a dark arch on light paper;
         dark flips to a light arch on a dark ground, with the doorway staying
         darker so the two-part structure survives. -->
    <svg
      class="brand-icon"
      viewBox="0 0 1254 1254"
      role="img"
      aria-label="Nostos"
      focusable="false"
    >
      <path
        class="brand-icon__shape"
        d="M 850 248 L 819 228 L 794 215 L 765 203 L 726 191 L 687 183 L 650 179 L 610 179 L 583 182 L 548 189 L 503 203 L 474 215 L 438 234 L 403 257 L 378 277 L 344 310 L 316 344 L 284 394 L 262 440 L 245 491 L 234 549 L 232 572 L 232 984 L 225 1054 L 218 1087 L 213 1101 L 215 1107 L 225 1108 L 270 1105 L 362 1095 L 440 1083 L 528 1065 L 587 1049 L 636 1031 L 655 1022 L 674 1010 L 691 993 L 699 974 L 697 958 L 686 940 L 671 927 L 655 917 L 624 903 L 504 868 L 485 857 L 476 848 L 471 840 L 464 817 L 460 784 L 459 575 L 466 539 L 471 525 L 483 502 L 505 474 L 528 452 L 550 435 L 594 409 L 646 387 L 692 375 L 737 369 L 772 369 L 798 374 L 811 381 L 820 390 L 827 408 L 827 1073 L 829 1082 L 837 1091 L 845 1094 L 1020 1094 L 1023 1091 L 1023 584 L 1020 547 L 1015 515 L 1002 465 L 988 427 L 972 393 L 950 355 L 928 324 L 905 297 L 882 274 Z"
      />
      <path
        class="brand-icon__doorway"
        d="M 798 414 L 731 451 L 695 475 L 664 503 L 651 521 L 643 538 L 639 558 L 639 820 L 643 830 L 650 836 L 672 845 L 732 875 L 781 904 L 805 921 L 808 921 L 810 917 L 810 421 L 808 416 L 805 414 Z"
      />
    </svg>
    <span class="brand">Collections</span>
  </div>

  <div class="nav-scroll-area">
    <div class="nav-group">
      <button
        class="nav-item"
        (click)="clearFilters()"
        [class.active]="!hasSelection()"
        title="All Books"
      >
        <lucide-icon [img]="LibraryIcon" [size]="16" strokeWidth="1.5"></lucide-icon>
        <span class="label">All Books</span>
        <span class="count-badge">{{ statusCounts()?.all }}</span>
      </button>

      <button
        class="nav-item"
        (click)="toggleStatus('notstarted')"
        [class.active]="filters.status() === 'notstarted'"
        title="Not Started"
      >
        <lucide-icon [img]="CircleDashedIcon" [size]="16" strokeWidth="1.5"></lucide-icon>
        <span class="label">Not Started</span>
        <span class="count-badge">{{ statusCounts()?.notStarted }}</span>
      </button>

      <button
        class="nav-item"
        (click)="toggleStatus('reading')"
        [class.active]="filters.status() === 'reading'"
        title="In Progress"
      >
        <lucide-icon [img]="BookOpenIcon" [size]="16" strokeWidth="1.5"></lucide-icon>
        <span class="label">In Progress</span>
        <span class="count-badge">{{ statusCounts()?.reading }}</span>
      </button>

      <button
        class="nav-item"
        (click)="toggleStatus('favorites')"
        [class.active]="filters.status() === 'favorites'"
        title="Favorites"
      >
        <lucide-icon [img]="HeartIcon" [size]="16" strokeWidth="1.5"></lucide-icon>
        <span class="label">Favorites</span>
        <span class="count-badge">{{ statusCounts()?.favorites }}</span>
      </button>

      <button
        class="nav-item"
        (click)="toggleStatus('finished')"
        [class.active]="filters.status() === 'finished'"
        title="Finished"
      >
        <lucide-icon [img]="CheckCircleIcon" [size]="16" strokeWidth="1.5"></lucide-icon>
        <span class="label">Finished</span>
        <span class="count-badge">{{ statusCounts()?.finished }}</span>
      </button>

      <button
        class="nav-item"
        (click)="toggleStatus('unsorted')"
        [class.active]="filters.status() === 'unsorted'"
        title="Unsorted"
      >
        <lucide-icon [img]="InboxIcon" [size]="16" strokeWidth="1.5"></lucide-icon>
        <span class="label">Unsorted</span>
        <span class="count-badge">{{ statusCounts()?.unsorted }}</span>
      </button>
    </div>

    <div class="nav-group">
      <div class="collapsible">
        <div class="section-label">MEDIA</div>
      </div>

      <button
        class="nav-item"
        (click)="toggleFormat('audiobook')"
        [class.active]="filters.format() === 'audiobook'"
        title="Audiobooks"
      >
        <lucide-icon [img]="HeadphonesIcon" [size]="16" strokeWidth="1.5"></lucide-icon>
        <span class="label">Audiobooks</span>
        <span class="count-badge">{{ statusCounts()?.audiobooks }}</span>
      </button>

      <button
        class="nav-item"
        (click)="toggleFormat('ebook')"
        [class.active]="filters.format() === 'ebook'"
        title="eBooks"
      >
        <lucide-icon [img]="BookOpenIcon" [size]="16" strokeWidth="1.5"></lucide-icon>
        <span class="label">eBooks</span>
        <span class="count-badge">{{ statusCounts()?.ebooks }}</span>
      </button>

      <button
        class="nav-item"
        (click)="toggleFormat('pdf')"
        [class.active]="filters.format() === 'pdf'"
        title="PDFs"
      >
        <lucide-icon [img]="FileTextIcon" [size]="16" strokeWidth="1.5"></lucide-icon>
        <span class="label">PDFs</span>
        <span class="count-badge">{{ statusCounts()?.pdfs }}</span>
      </button>
    </div>

    <div class="nav-group">
      <div class="collapsible">
        <div class="section-label">Collections</div>
      </div>

      <div class="collapsible">
        <div class="root-drop-list">
          <app-flat-tree
            [items]="treeItems()"
            [activeId]="filters.collectionId()"
            [editingId]="editingId()"
            [treatAllAsFolders]="true"
            [emptyLabel]="'No collections yet'"
            (nodeSelected)="select($event.id)"
            (nodeMoved)="onItemMoved($event)"
            (nodeRenamed)="startRename($event)"
            (nodeDeleted)="deleteCollection($event)"
            (nodeRenameSaved)="saveRename($event.id, $event.newName)"
            (nodeRenameCancelled)="cancelRename()"
          ></app-flat-tree>
        </div>
      </div>
    </div>

    <div class="nav-group mt-auto">
      @if (adding()) {
        <div class="nav-item input-mode">
          <lucide-icon [img]="PlusIcon" [size]="16" strokeWidth="1.5"></lucide-icon>
          <input
            type="text"
            class="sidebar-input"
            [(ngModel)]="newName"
            (keydown.enter)="create()"
            (keydown.escape)="resetInput()"
            placeholder="Name..."
            autoFocus
          />
        </div>
      } @else {
        <button class="nav-item action-add" (click)="startAdd()" title="Create Collection">
          <lucide-icon [img]="PlusIcon" [size]="16" strokeWidth="1.5"></lucide-icon>
          <span class="label">New Collection</span>
        </button>
      }
    </div>
  </div>

  <div class="sidebar-footer">
    <div class="footer-slot">
      @if (!expanded() && filters.collectionId()) {
        <span
          class="collapsed-collection-indicator"
          role="status"
          [attr.title]="'Viewing ' + (getNameForId(filters.collectionId()!) || 'collection')"
          aria-label="A collection is selected"
        >
          <lucide-icon [img]="FolderIcon" [size]="14" strokeWidth="1.5"></lucide-icon>
        </span>
      }
      <button
        class="toggle-btn"
        (click)="toggle()"
        [attr.aria-expanded]="expanded()"
        [attr.title]="expanded() ? 'Collapse sidebar' : 'Expand sidebar'"
      >
        <lucide-icon
          [img]="expanded() ? PanelLeftCloseIcon : PanelLeftOpenIcon"
          [size]="18"
          strokeWidth="1"
        ></lucide-icon>
      </button>
    </div>
  </div>
</nav>
