@if (isOpen()) {
  <app-modal-shell
    [isOpen]="true"
    variant="dialog"
    cardClass="add-intent-card"
    [maxWidth]="'440px'"
    [layer]="100"
    [headDivider]="false"
    ariaLabelledBy="add-intent-title"
    [style.--modal-head-padding]="'0'"
    [style.--modal-card-padding]="'1.5rem 1.5rem 1.25rem'"
    [style.--modal-card-padding-narrow]="'1.25rem 1.15rem 1.1rem'"
    (closed)="cancel.emit()"
  >
    <div class="add-intent-head" shellHeader>
      <h2 id="add-intent-title" class="add-intent-title">Add a book</h2>
      <p class="add-intent-subtitle">How is this book coming into Nostos?</p>
    </div>

    <div class="add-intent-choices">
      <button type="button" class="add-intent-choice" (click)="upload.emit()">
        <span class="add-intent-mark" aria-hidden="true">
          <nostos-icon name="upload-simple" [size]="16"></nostos-icon>
        </span>
        <span class="add-intent-text">
          <span class="add-intent-label">Upload a book file</span>
          <span class="add-intent-hint">Choose an EPUB, PDF, or supported audiobook file from this device</span>
        </span>
      </button>

      <button type="button" class="add-intent-choice" (click)="source.emit()">
        <span class="add-intent-mark" aria-hidden="true">
          <nostos-icon name="magnifying-glass" [size]="16"></nostos-icon>
        </span>
        <span class="add-intent-text">
          <span class="add-intent-label">Find a free book</span>
          <span class="add-intent-hint">Search free books and audiobooks in one place</span>
        </span>
      </button>

      <button type="button" class="add-intent-choice" (click)="physical.emit()">
        <span class="add-intent-mark" aria-hidden="true">
          <nostos-icon name="bookmark-simple" [size]="16"></nostos-icon>
        </span>
        <span class="add-intent-text">
          <span class="add-intent-label">Add a physical book</span>
          <span class="add-intent-hint">Identify a print book by ISBN, with manual entry as a fallback</span>
        </span>
      </button>

      <button type="button" class="add-intent-choice" (click)="manual.emit()">
        <span class="add-intent-mark" aria-hidden="true">
          <nostos-icon name="pencil-simple" [size]="16"></nostos-icon>
        </span>
        <span class="add-intent-text">
          <span class="add-intent-label">Enter manually</span>
          <span class="add-intent-hint">Create a library record when no file or lookup is useful</span>
        </span>
      </button>
    </div>

    <div class="add-intent-actions" shellActions>
      <button appButton type="button" variant="secondary" (click)="cancel.emit()">Cancel</button>
    </div>
  </app-modal-shell>
}
