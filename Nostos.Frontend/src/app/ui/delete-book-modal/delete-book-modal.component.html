@if (isOpen()) {
  <div
    class="modal-backdrop"
    (click)="onBackdropClick()"
    role="presentation"
  >
    <div
      class="delete-modal-card"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="delete-dialog-title"
      aria-describedby="delete-dialog-description"
      (click)="$event.stopPropagation()"
    >
      <div class="danger-icon-badge" aria-hidden="true">
        <lucide-icon [img]="Trash2Icon" [size]="22" strokeWidth="2"></lucide-icon>
      </div>

      <div class="modal-content-body">
        <h3 id="delete-dialog-title" class="delete-title">
          @if (bookTitle()) {
            Delete "{{ bookTitle() }}"?
          } @else {
            Delete Book?
          }
        </h3>
        <p id="delete-dialog-description" class="delete-description">
          This action cannot be undone. The book file, annotations, and all reading progress will be permanently deleted from your library.
        </p>
      </div>

      <div class="modal-actions">
        <button
          type="button"
          class="btn-cancel"
          (click)="cancel.emit()"
          [disabled]="deleting()"
        >
          Cancel
        </button>
        <button
          type="button"
          class="btn-delete-confirm"
          (click)="confirm.emit()"
          [disabled]="deleting()"
        >
          @if (deleting()) {
            <lucide-icon [img]="LoaderIcon" [size]="16" class="spin-icon"></lucide-icon>
            <span>Deleting…</span>
          } @else {
            <lucide-icon [img]="Trash2Icon" [size]="16"></lucide-icon>
            <span>Delete Permanently</span>
          }
        </button>
      </div>
    </div>
  </div>
}
