<section class="concept-map" [attr.aria-busy]="loading()" aria-label="Concept map">
  @if (isCapped()) {
  <p class="map-limit-note">Showing the 150 most-referenced concepts.</p>
  }

  <div class="map-stage">
    <div class="map-controls" role="group" aria-label="Map controls">
      <button
        type="button"
        class="map-zoom"
        aria-label="Zoom out"
        title="Zoom out"
        (click)="zoomOut()"
      >
        −
      </button>
      <button
        type="button"
        class="map-zoom"
        aria-label="Zoom in"
        title="Zoom in"
        (click)="zoomIn()"
      >
        +
      </button>
      <button type="button" class="map-reset" (click)="resetView()">Reset view</button>
    </div>

    <div #sigmaContainer class="sigma-container"></div>
  </div>

  @if (loading()) {
  <p class="map-status" role="status" aria-live="polite">Loading graph…</p>
  } @else if (noConnections()) {
  <p class="map-status" role="status" aria-live="polite">No connections yet</p>
  }

  <ul class="map-accessible-list visually-hidden" aria-label="Concepts in this map">
    @for (node of accessibleNodes(); track node.id) {
    <li>
      <button
        type="button"
        [class.selected]="selectedNodeId() === node.id"
        [attr.aria-pressed]="selectedNodeId() === node.id"
        (click)="selectAccessibleNode(node.id)"
      >
        {{ node.name }} — {{ node.usageCount }} references, {{ node.connectionCount }} connections
      </button>
    </li>
    }
  </ul>
</section>
