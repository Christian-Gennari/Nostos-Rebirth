<main class="hero-wrapper">
  <div class="hero-content">
    <!-- Kit v1 horizontal lockup: the tile mark plus the wordmark. Inline (not
         an <img>) so the tile can re-ink per theme and the wordmark uses the
         app's Hanken Grotesk, exactly as the kit ships it. -->
    <div class="hero-lockup">
      <svg
        viewBox="0 0 1840 512"
        role="img"
        aria-label="Nostos"
        focusable="false"
      >
        <g transform="scale(0.5)">
          <rect class="hero-lockup__tile" x="0" y="0" width="1024" height="1024" rx="205" />
          <path
            class="hero-lockup__arch"
            d="M 282 764 L 282 509 A 229 234 0 0 1 740 509 L 740 764 Z M 358 764 L 358 509 A 110 112 0 0 1 578 509 L 578 764 Z"
            fill-rule="evenodd"
          />
        </g>
        <text
          class="hero-lockup__word"
          x="625"
          y="345"
          font-size="255"
          font-weight="500"
          letter-spacing="-8"
        >nostos</text>
      </svg>
    </div>

    <div class="hero-divider"></div>

    <p class="hero-subtitle">
      A return to your stories.<br />
      Your digital sanctuary for books and thoughts.
    </p>

    <div class="hero-actions">
      <a class="btn btn-primary lg" routerLink="/library"> Open Library </a>
    </div>
  </div>

  <div class="hero-footer">
    <span>v1.0 Rebirth</span>
  </div>
</main>
