<section class="assignment-card" aria-labelledby="book-assignment-heading">
  <header class="card-header">
    <h2 id="book-assignment-heading">Add a training book</h2>
  </header>

  @if (availableBooks().length === 0) {
    <p class="empty-state">No books available to assign.</p>
  } @else {
    <div class="field">
      <label class="field-label" for="book-assignment-book">Book</label>
      <select
        id="book-assignment-book"
        [value]="selectedBookId()"
        (change)="onBookChange($event)"
        [disabled]="busy()"
        [attr.aria-invalid]="submitted() && bookError() ? 'true' : null"
        [attr.aria-describedby]="submitted() && bookError() ? 'book-assignment-book-error' : null"
      >
        @for (book of availableBooks(); track book.bookId) {
          <option [value]="book.bookId">
            {{ book.title }}{{ book.author ? ' — ' + book.author : '' }}
          </option>
        }
      </select>
      @if (submitted() && bookError(); as error) {
        <p class="field-error" id="book-assignment-book-error" role="alert">{{ error }}</p>
      }
    </div>

    <div class="field">
      <label class="field-label" for="book-assignment-mode">Mode</label>
      <select
        id="book-assignment-mode"
        (change)="onModeChange($event)"
        [disabled]="busy()"
      >
        <option [attr.value]="modeEnum.Endurance" [selected]="mode() === modeEnum.Endurance">Endurance</option>
        <option [attr.value]="modeEnum.Deep" [selected]="mode() === modeEnum.Deep">Deep</option>
        <option [attr.value]="modeEnum.Recovery" [selected]="mode() === modeEnum.Recovery">Recovery</option>
      </select>
    </div>

    <div class="check-field">
      <input
        id="book-assignment-make-default"
        type="checkbox"
        [checked]="makeDefault()"
        (change)="onMakeDefaultToggle($event)"
        [disabled]="busy()"
      />
      <label class="check-label" for="book-assignment-make-default">Make this the default book</label>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-primary" (click)="onSubmit()" [disabled]="busy()">
        Add book
      </button>
    </div>
  }
</section>
