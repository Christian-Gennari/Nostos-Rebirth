<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nostos (Rebirth)</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121316" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Nostos brand kit v1 favicon: ONE mark, the kit's primary variant
         (forest tile + paper arch) on every colour scheme. There is no
         theme-aware pair any more — the app's own brand mark is theme-invariant
         too (see --brand-shape in styles.css), so the tab icon matches it in
         both light and dark chrome.

         The .ico carries the same forest-tile artwork and is the fallback for
         browsers without SVG icons.

         `sizes` on the .ico link is LOAD-BEARING, not decoration: Chromium
         otherwise always prefers the .ico over the SVG. Verified against a
         headed Chromium — with `sizes` the SVG wins, without it the .ico does.
         Do not remove it. -->
    <link rel="icon" type="image/svg+xml" href="favicon-light.svg" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  </head>

  <body>
    <!-- Theme hydration, BEFORE first paint.
         Without this, an app booted in dark would paint light for one frame and
         then flip. The read must be synchronous and inline (a module would be
         fetched too late), and it must mirror `theme.service.ts` exactly:
         key `nostos.theme`, values `light`/`dark`/`sepia`/absent — where an
         absent value means "follow the OS", which only ever resolves to
         light or dark. Keep the two in sync. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('nostos.theme');
          var explicit = stored === 'dark' || stored === 'sepia' ? stored : null;
          var dark =
            stored !== 'sepia' &&
            (stored === 'dark' ||
              (stored !== 'light' &&
                window.matchMedia('(prefers-color-scheme: dark)').matches));
          var theme = explicit || (dark ? 'dark' : null);
          if (theme) document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          /* storage unavailable — stay light */
        }
      })();
    </script>
    <app-root></app-root>
  </body>
</html>
