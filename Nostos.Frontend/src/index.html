<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nostos (Rebirth)</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#28372D" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Improved brand kit favicons: theme-aware SVG (the bare mark on light
         browser chrome, the mark on a Paper (#FDF8F6) tile on dark chrome) with
         the Paper-tile .ico as the fallback for browsers without SVG favicons,
         so the tab icon stays legible on either chrome. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="favicon-light.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="favicon-dark.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  </head>

  <body>
    <!-- Theme hydration, BEFORE first paint.
         Without this, an app booted in dark would paint light for one frame and
         then flip. The read must be synchronous and inline (a module would be
         fetched too late), and it must mirror `theme.service.ts` exactly:
         key `nostos.theme`, values `dark`/absent. Keep the two in sync. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('nostos.theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {
          /* storage unavailable — stay light */
        }
      })();
    </script>
    <app-root></app-root>
  </body>
</html>
