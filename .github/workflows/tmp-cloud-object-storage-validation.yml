name: Temporary Cloud object storage validation

on:
  push:
    branches:
      - feature/cloud-object-storage

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Nostos.sln

      - name: Build
        run: dotnet build Nostos.sln --configuration Debug --no-restore

      - name: Backend regression tests
        run: >-
          dotnet test Nostos.Backend.Tests/Nostos.Backend.Tests.csproj
          --configuration Debug
          --no-build
          --no-restore
          --logger "console;verbosity=minimal"

      - name: Start MinIO
        run: |
          docker run -d --name nostos-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs nostos-minio
          exit 1

      - name: Cloud object storage integration
        env:
          NOSTOS_S3_TEST_ENDPOINT: "http://127.0.0.1:9000"
          NOSTOS_S3_TEST_ACCESS_KEY: "minioadmin"
          NOSTOS_S3_TEST_SECRET_KEY: "minioadmin"
        run: >-
          dotnet test Nostos.Backend.Tests/Nostos.Backend.Tests.csproj
          --configuration Debug
          --no-build
          --no-restore
          --filter "Category=CloudObjectStorage"
          --logger "console;verbosity=normal"
