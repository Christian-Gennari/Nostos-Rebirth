name: Verify UI kit button branch

on:
  push:
    branches:
      - feature/ui-kit-button-settings

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Nostos.Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Nostos.Frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run check:design -- --self-test
      - run: npm test
        env:
          CI: "true"
      - run: npm run build
