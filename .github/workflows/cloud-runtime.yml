name: Cloud runtime

on:
  push:
    branches:
      - feature/cloud-stateless-runtime
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Nostos.Backend/**"
      - "Nostos.Backend.Tests/**"
      - "Nostos.Frontend/**"
      - "docs/cloud/runtime.md"
      - ".github/workflows/cloud-runtime.yml"
  workflow_dispatch:

jobs:
  runtime-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: nostos_spike
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nostos_spike"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NOSTOS_POSTGRES_SPIKE_CONNECTION: "Host=127.0.0.1;Port=5432;Database=nostos_spike;Username=postgres;Include Error Detail=true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Nostos.Frontend/package-lock.json

      - name: Restore backend
        run: dotnet restore Nostos.sln

      - name: Build backend solution
        run: dotnet build Nostos.sln --configuration Debug --no-restore

      - name: Run backend regression suite
        env:
          NOSTOS_POSTGRES_SPIKE_CONNECTION: ""
        run: >-
          dotnet test Nostos.Backend.Tests/Nostos.Backend.Tests.csproj
          --configuration Debug
          --no-build
          --no-restore
          --logger "console;verbosity=minimal"

      - name: Run Cloud runtime PostgreSQL tests
        run: >-
          dotnet test Nostos.Backend.Tests/Nostos.Backend.Tests.csproj
          --configuration Debug
          --no-build
          --no-restore
          --filter "Category=CloudRuntime|Category=CloudProvisioning|Category=CloudMigrations|Category=PostgresSpike"
          --logger "console;verbosity=normal"

      - name: Start S3-compatible MinIO
        run: |
          access_key="nostosci"
          secret_key="nostos-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "NOSTOS_S3_TEST_ACCESS_KEY=$access_key" >> "$GITHUB_ENV"
          echo "NOSTOS_S3_TEST_SECRET_KEY=$secret_key" >> "$GITHUB_ENV"

          docker run -d --name nostos-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER="$access_key" \
            -e MINIO_ROOT_PASSWORD="$secret_key" \
            quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs nostos-minio
          exit 1

      - name: Run object-storage integration tests
        env:
          NOSTOS_S3_TEST_ENDPOINT: "http://127.0.0.1:9000"
        run: >-
          dotnet test Nostos.Backend.Tests/Nostos.Backend.Tests.csproj
          --configuration Debug
          --no-build
          --no-restore
          --filter "Category=CloudObjectStorage"
          --logger "console;verbosity=normal"

      - name: Install frontend dependencies
        working-directory: Nostos.Frontend
        run: npm ci

      - name: Frontend design checks
        working-directory: Nostos.Frontend
        run: npm run check

      - name: Frontend unit tests
        working-directory: Nostos.Frontend
        run: npm test -- --watch=false

      - name: Frontend production build
        working-directory: Nostos.Frontend
        run: npm run build

      - name: Build production container
        run: docker build --pull --tag nostos-runtime:test .

      - name: Smoke-test production container
        run: |
          docker run -d --name nostos-runtime-test -p 18080:8080 nostos-runtime:test

          cleanup() {
            docker logs nostos-runtime-test || true
            docker rm -f nostos-runtime-test >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/health/live >/dev/null \
              && curl -fsS http://127.0.0.1:18080/health/ready >/dev/null; then
              break
            fi
            if [ "$i" -eq 45 ]; then
              exit 1
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:18080/ >/dev/null
          docker exec nostos-runtime-test ffmpeg -version >/dev/null
          docker exec nostos-runtime-test ffprobe -version >/dev/null

          runtime_user="$(docker inspect -f '{{.Config.User}}' nostos-runtime-test)"
          test -n "$runtime_user"
          test "$runtime_user" != "0"
