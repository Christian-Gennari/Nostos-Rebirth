name: Temp 347 verify

on:
  push:
    branches:
      - cleanup/347-nullability-warnings

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Nostos.Backend.Tests/Nostos.Backend.Tests.csproj
      - run: dotnet test Nostos.Backend.Tests/Nostos.Backend.Tests.csproj --configuration Debug --no-restore
