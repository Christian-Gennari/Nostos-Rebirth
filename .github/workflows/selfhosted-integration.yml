name: SelfHosted integration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selfhosted:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      Nostos__DeploymentMode: SelfHosted
      NOSTOS_POSTGRES_SPIKE_CONNECTION: ""
      GH_TOKEN: ""
      NOSTOS_CLOUD_GH_TOKEN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Nostos.sln

      - name: Build backend solution
        run: dotnet build Nostos.sln --configuration Debug --no-restore

      - name: Start the public host and verify SelfHosted SQLite bootstrap
        run: bash scripts/verify-selfhosted-smoke.sh Debug

      - name: Verify SQLite, local media, backup/restore and portability
        run: >-
          dotnet test Nostos.Backend.Tests/Nostos.Backend.Tests.csproj
          --configuration Debug
          --no-build
          --no-restore
          --filter "FullyQualifiedName~DatabaseBootstrapServiceTests|FullyQualifiedName~FileStorageServiceTests|FullyQualifiedName~BackupServiceTests|FullyQualifiedName~LibraryServiceTests|FullyQualifiedName~LibraryEndpointTests|FullyQualifiedName~PortableArchiveServiceTests"
          --logger "console;verbosity=normal"
