name: Verify editorial app dock

on:
  push:
    branches:
      - feature/editorial-app-dock

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: Nostos.Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Nostos.Frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: npm run check
      - run: npm run check:design -- --self-test
      - run: npm test
        env:
          CI: "true"
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/editorial-dock-preview.spec.ts --project=desktop-chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-dock-preview
          path: Nostos.Frontend/e2e/test-results/editorial-dock-preview/*.png
          if-no-files-found: warn
