name: Temp 349 verify

on:
  push:
    branches:
      - cleanup/349-commonjs-warnings

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Nostos.Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Nostos.Frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false
      - run: npm run check
