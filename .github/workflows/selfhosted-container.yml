name: SelfHosted container

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production container
        run: docker build --pull --tag nostos-runtime:test .

      - name: Smoke-test production container
        run: |
          docker run -d --name nostos-runtime-test -p 18080:8080 nostos-runtime:test

          cleanup() {
            docker logs nostos-runtime-test || true
            docker rm -f nostos-runtime-test >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/health/live >/dev/null               && curl -fsS http://127.0.0.1:18080/health/ready >/dev/null; then
              break
            fi
            if [ "$i" -eq 45 ]; then
              exit 1
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:18080/ >/dev/null
          curl -fsS http://127.0.0.1:18080/api/runtime/capabilities             | grep -q '"deploymentMode":"SelfHosted"'
          docker exec nostos-runtime-test ffmpeg -version >/dev/null
          docker exec nostos-runtime-test ffprobe -version >/dev/null

          runtime_user="$(docker inspect -f '{{.Config.User}}' nostos-runtime-test)"
          test -n "$runtime_user"
          test "$runtime_user" != "0"
