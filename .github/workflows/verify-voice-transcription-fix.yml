name: Verify voice transcription fix

on:
  push:
    branches:
      - fix/voice-transcription-mime

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Backend tests
        run: dotnet test Nostos.Backend.Tests/Nostos.Backend.Tests.csproj --configuration Release
      - name: Solution build
        run: dotnet build Nostos.sln --configuration Release --no-restore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Nostos.Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Nostos.Frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: CSS and theme checks
        run: npm run check
      - name: Frontend unit tests
        run: npm test
        env:
          CI: 'true'
      - name: Production build
        run: npm run build
