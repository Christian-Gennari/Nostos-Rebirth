name: Verify issue 324 reader note locations

on:
  push:
    branches:
      - fix/assistant-reader-note-location

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Nostos.Frontend/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install frontend dependencies
        working-directory: Nostos.Frontend
        run: npm ci

      - name: Frontend integrity checks
        working-directory: Nostos.Frontend
        run: npm run check

      - name: Frontend unit tests
        working-directory: Nostos.Frontend
        run: npm test

      - name: Frontend production build
        working-directory: Nostos.Frontend
        run: npm run build

      - name: Backend build
        run: dotnet build Nostos.sln

      - name: Backend tests
        run: dotnet test Nostos.Backend.Tests/Nostos.Backend.Tests.csproj --no-build
