name: Agent 362 Book Detail verification

on:
  push:
    branches:
      - refactor/ui-book-detail-kit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Nostos.Frontend/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install frontend dependencies
        working-directory: Nostos.Frontend
        run: npm ci

      - name: Check
        working-directory: Nostos.Frontend
        run: npm run check

      - name: Unit tests
        working-directory: Nostos.Frontend
        run: npm test

      - name: Build
        working-directory: Nostos.Frontend
        run: npm run build

      - name: Install Chromium
        working-directory: Nostos.Frontend
        run: npx playwright install --with-deps chromium

      - name: Book Detail browser matrix
        working-directory: Nostos.Frontend
        run: npm run e2e -- agent-362-book-detail-kit.spec.ts --project=desktop-chromium

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-362-book-detail-evidence
          path: |
            Nostos.Frontend/e2e/test-results
          if-no-files-found: ignore
          retention-days: 3
