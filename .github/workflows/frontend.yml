# Shared frontend gate used by the dual-mode CI orchestrator.
name: Frontend

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Nostos.Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Nostos.Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Design checks (CSS integrity, theme tokens, design language)
        run: npm run check

      - name: Unit tests
        run: npm test -- --watch=false

      - name: Production build
        run: npm run build
