name: Verify issue 331

on:
  push:
    branches:
      - fix/physical-books-metadata-only

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Nostos.Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Nostos.Frontend
        run: npm ci

      - name: Frontend checks
        working-directory: Nostos.Frontend
        run: npm run check

      - name: Frontend tests
        working-directory: Nostos.Frontend
        run: npm test

      - name: Frontend build
        working-directory: Nostos.Frontend
        run: npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Solution build
        run: dotnet build Nostos.sln

      - name: Backend tests
        run: dotnet test Nostos.Backend.Tests/Nostos.Backend.Tests.csproj --no-build
