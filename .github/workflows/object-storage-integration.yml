name: Object storage integration

on:
  pull_request:
    paths:
      - "Nostos.Backend/**"
      - "Nostos.Backend.Tests/**"
      - ".github/workflows/object-storage-integration.yml"
  workflow_dispatch:

jobs:
  object-storage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Nostos.sln

      - name: Build backend solution
        run: dotnet build Nostos.sln --configuration Debug --no-restore

      - name: Start S3-compatible MinIO
        run: |
          access_key="nostosci"
          secret_key="nostos-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "NOSTOS_S3_TEST_ACCESS_KEY=$access_key" >> "$GITHUB_ENV"
          echo "NOSTOS_S3_TEST_SECRET_KEY=$secret_key" >> "$GITHUB_ENV"

          docker run -d --name nostos-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER="$access_key" \
            -e MINIO_ROOT_PASSWORD="$secret_key" \
            quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs nostos-minio
          exit 1

      - name: Run Cloud object storage integration tests
        env:
          NOSTOS_S3_TEST_ENDPOINT: "http://127.0.0.1:9000"
        run: >-
          dotnet test Nostos.Backend.Tests/Nostos.Backend.Tests.csproj
          --configuration Debug
          --no-build
          --no-restore
          --filter "Category=CloudObjectStorage"
          --logger "console;verbosity=normal"
