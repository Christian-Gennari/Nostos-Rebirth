# PostgreSQL integration coverage for the shared Nostos model and Cloud tenant fleet.
name: PostgreSQL integration

on:
  push:
    branches:
      - feature/cloud-postgres-spike
  pull_request:
    paths:
      - "Nostos.Backend/**"
      - "Nostos.Backend.Tests/**"
      - ".github/workflows/postgresql-compatibility.yml"

jobs:
  postgres-compatibility:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: nostos_spike
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nostos_spike"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NOSTOS_POSTGRES_SPIKE_CONNECTION: "Host=127.0.0.1;Port=5432;Database=nostos_spike;Username=postgres;Include Error Detail=true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Nostos.sln

      - name: Build backend solution
        run: dotnet build Nostos.sln --configuration Debug --no-restore

      - name: Run backend regression tests
        env:
          NOSTOS_POSTGRES_SPIKE_CONNECTION: ""
        run: >-
          dotnet test Nostos.Backend.Tests/Nostos.Backend.Tests.csproj
          --configuration Debug
          --no-build
          --no-restore
          --logger "console;verbosity=minimal"

      - name: Run PostgreSQL compatibility spike
        run: >-
          dotnet test Nostos.Backend.Tests/Nostos.Backend.Tests.csproj
          --configuration Debug
          --no-build
          --no-restore
          --filter "Category=PostgresSpike"
          --logger "console;verbosity=normal"

      - name: Run Cloud provisioning isolation tests
        run: >-
          dotnet test Nostos.Backend.Tests/Nostos.Backend.Tests.csproj
          --configuration Debug
          --no-build
          --no-restore
          --filter "Category=CloudProvisioning"
          --logger "console;verbosity=normal"

      - name: Run Cloud PostgreSQL migration lifecycle tests
        run: >-
          dotnet test Nostos.Backend.Tests/Nostos.Backend.Tests.csproj
          --configuration Debug
          --no-build
          --no-restore
          --filter "Category=CloudMigrations"
          --logger "console;verbosity=normal"

      - name: Run Cloud entitlement control-plane tests
        run: >-
          dotnet test Nostos.Backend.Tests/Nostos.Backend.Tests.csproj
          --configuration Debug
          --no-build
          --no-restore
          --filter "Category=CloudEntitlements"
          --logger "console;verbosity=normal"

      - name: Run Cloud billing reconciliation tests
        run: >-
          dotnet test Nostos.Backend.Tests/Nostos.Backend.Tests.csproj
          --configuration Debug
          --no-build
          --no-restore
          --filter "Category=CloudBilling"
          --logger "console;verbosity=normal"
