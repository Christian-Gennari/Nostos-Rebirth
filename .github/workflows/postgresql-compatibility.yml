# Cloud/PostgreSQL integration coverage for the shared Nostos model and tenant fleet.
name: Cloud PostgreSQL integration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: nostos_spike
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nostos_spike"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NOSTOS_POSTGRES_SPIKE_CONNECTION: "Host=127.0.0.1;Port=5432;Database=nostos_spike;Username=postgres;Include Error Detail=true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Nostos.sln

      - name: Build backend solution
        run: dotnet build Nostos.sln --configuration Debug --no-restore

      - name: Run shared PostgreSQL model compatibility
        run: >-
          dotnet test Nostos.Backend.Tests/Nostos.Backend.Tests.csproj
          --configuration Debug
          --no-build
          --no-restore
          --filter "Category=PostgresSpike"
          --logger "console;verbosity=normal"

      - name: Run Cloud provisioning and tenant-isolation coverage
        run: >-
          dotnet test Nostos.Backend.Tests/Nostos.Backend.Tests.csproj
          --configuration Debug
          --no-build
          --no-restore
          --filter "Category=CloudProvisioning"
          --logger "console;verbosity=normal"

      - name: Run explicit PostgreSQL migration lifecycle coverage
        run: >-
          dotnet test Nostos.Backend.Tests/Nostos.Backend.Tests.csproj
          --configuration Debug
          --no-build
          --no-restore
          --filter "Category=CloudMigrations"
          --logger "console;verbosity=normal"

      - name: Run stateless Cloud runtime PostgreSQL coverage
        run: >-
          dotnet test Nostos.Backend.Tests/Nostos.Backend.Tests.csproj
          --configuration Debug
          --no-build
          --no-restore
          --filter "Category=CloudRuntime"
          --logger "console;verbosity=normal"

      - name: Run Cloud entitlement and billing control-plane coverage
        run: >-
          dotnet test Nostos.Backend.Tests/Nostos.Backend.Tests.csproj
          --configuration Debug
          --no-build
          --no-restore
          --filter "Category=CloudEntitlements|Category=CloudBilling"
          --logger "console;verbosity=normal"

      - name: Run deterministic Cloud auth and managed-AI composition coverage
        run: >-
          dotnet test Nostos.Backend.Tests/Nostos.Backend.Tests.csproj
          --configuration Debug
          --no-build
          --no-restore
          --filter "FullyQualifiedName~CloudAuthenticationTests|FullyQualifiedName~ManagedCloudAi|FullyQualifiedName~GeminiManagedLlmProviderTests|FullyQualifiedName~GroqManagedSttProviderTests|FullyQualifiedName~AiProviderSettingsEndpointTests|FullyQualifiedName~TranscriptionEndpointTests"
          --logger "console;verbosity=normal"
