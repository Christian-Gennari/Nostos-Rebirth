name: Agent 362 Studio verification

on:
  push:
    branches:
      - refactor/studio-ui-kit

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Nostos.Frontend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install frontend dependencies
        working-directory: Nostos.Frontend
        run: npm ci

      - name: Check
        working-directory: Nostos.Frontend
        run: npm run check

      - name: Unit tests
        working-directory: Nostos.Frontend
        run: npm test

      - name: Production build
        working-directory: Nostos.Frontend
        run: npm run build

      - name: Install Chromium
        working-directory: Nostos.Frontend
        run: npx playwright install --with-deps chromium

      - name: Desktop Studio browser verification
        working-directory: Nostos.Frontend
        run: npx playwright test e2e/agent-362-studio-ui-kit.spec.ts --project=desktop-chromium

      - name: Mobile Studio browser verification
        working-directory: Nostos.Frontend
        run: npx playwright test e2e/mobile-agent-362-studio-ui-kit.spec.ts --project=mobile-chromium

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-362-studio-browser-evidence
          path: |
            Nostos.Frontend/e2e/visual-evidence/agent-362-studio-*.png
            Nostos.Frontend/e2e/test-results
          if-no-files-found: ignore
