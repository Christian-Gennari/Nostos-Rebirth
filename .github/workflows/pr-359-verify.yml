name: PR 359 verification

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: Nostos.Frontend
        run: npm install --no-audit --no-fund

      - name: Design and integrity checks
        working-directory: Nostos.Frontend
        run: npm run check

      - name: Design scanner self-test
        working-directory: Nostos.Frontend
        run: npm run check:design -- --self-test

      - name: Unit tests
        working-directory: Nostos.Frontend
        run: npm test

      - name: Production build
        working-directory: Nostos.Frontend
        run: npm run build

      - name: Install Chromium
        working-directory: Nostos.Frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend
        working-directory: Nostos.Frontend
        run: |
          npm start -- --host 127.0.0.1 --port 4200 > /tmp/nostos-ui.log 2>&1 &
          echo $! > /tmp/nostos-ui.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4200/settings > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nostos-ui.log
          exit 1

      - name: Browser verification
        working-directory: Nostos.Frontend
        run: |
          mkdir -p /tmp/nostos-359-shots
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          const fs = require('node:fs');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });

            const openSettings = async () => {
              await page.goto('http://127.0.0.1:4200/settings', { waitUntil: 'domcontentloaded' });
              await page.locator('.settings-page').waitFor();
              await page.waitForTimeout(500);
            };
            const tab = async (name) => {
              await page.getByRole('tab', { name }).click();
              await page.waitForTimeout(100);
            };
            const setTheme = async (name) => {
              await tab('Appearance');
              await page.getByRole('radio', { name }).click();
              await page.waitForTimeout(150);
            };
            const assertPrimitives = async () => {
              const switches = await page.locator('label.nostos-switch').count();
              const badges = await page.locator('span.nostos-badge').count();
              if (switches !== 4) throw new Error(`Expected 4 Settings switches, found ${switches}`);
              if (badges < 2) throw new Error(`Expected Settings badges, found ${badges}`);
              for (const input of await page.locator('label.nostos-switch input[type="checkbox"]').all()) {
                const label = await input.getAttribute('aria-label');
                if (!label) throw new Error('Every Settings switch checkbox must have an accessible name');
              }
            };

            await openSettings();
            await setTheme('Light');
            await tab('Library & data');
            await assertPrimitives();
            await page.screenshot({ path: '/tmp/nostos-359-shots/desktop-light.png', fullPage: true });

            await setTheme('Dark');
            await tab('Assistant');
            await assertPrimitives();
            await page.screenshot({ path: '/tmp/nostos-359-shots/desktop-dark.png', fullPage: true });

            await page.setViewportSize({ width: 390, height: 844 });
            await setTheme('Light');
            await tab('Library & data');
            await assertPrimitives();
            await page.screenshot({ path: '/tmp/nostos-359-shots/mobile-light.png', fullPage: true });

            await setTheme('Dark');
            await tab('Assistant');
            await assertPrimitives();
            await page.screenshot({ path: '/tmp/nostos-359-shots/mobile-dark.png', fullPage: true });

            await browser.close();
            fs.writeFileSync('/tmp/nostos-359-shots/verification.txt', 'desktop/mobile light/dark Settings verification passed\n');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-359-browser-verification
          path: /tmp/nostos-359-shots
