name: issue-358-verification

on:
  push:
    branches:
      - feature/dialog-actions

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Nostos.Frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Nostos.Frontend/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          CI: 'true'
      - run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Start verification server
        run: |
          npm start -- --host 127.0.0.1 --port 4200 > /tmp/nostos-issue-358.log 2>&1 &
          echo $! > /tmp/nostos-issue-358.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4200/__verify/dialog-actions?mode=confirm >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nostos-issue-358.log
          exit 1

      - name: Verify dialogs in Chromium
        run: node scripts/verify-issue-358.mjs

      - name: Show server log
        if: always()
        run: cat /tmp/nostos-issue-358.log || true

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-358-browser-evidence
          path: Nostos.Frontend/verification-artifacts/issue-358
          if-no-files-found: ignore
