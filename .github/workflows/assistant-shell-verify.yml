name: Temporary assistant shell verification

on:
  push:
    branches:
      - feat/320-assistant-responsive-shell

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Nostos.Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Nostos.Frontend
        run: npm ci

      - name: Frontend integrity checks
        working-directory: Nostos.Frontend
        run: npm run check

      - name: Frontend unit tests
        working-directory: Nostos.Frontend
        env:
          CI: "true"
        run: npm test

      - name: Frontend production build
        working-directory: Nostos.Frontend
        run: npm run build

      - name: Backend build
        run: dotnet build Nostos.sln

      - name: Install Playwright Chromium
        working-directory: Nostos.Frontend
        run: npx playwright install --with-deps chromium

      - name: Desktop expanded assistant regression
        working-directory: Nostos.Frontend
        run: npx playwright test e2e/assistant-expanded-shell.spec.ts --project=desktop-chromium

      - name: Mobile assistant geometry regressions
        working-directory: Nostos.Frontend
        run: npx playwright test e2e/mobile-assistant-geometry.spec.ts --project=mobile-chromium
